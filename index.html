<!doctype html>
<html lang="en">
<head>
  <script>
    /* Set the theme before first paint — otherwise light-mode users see a dark flash. */
    (function () {
      var p = null;
      try { p = localStorage.getItem('garage.theme'); } catch (e) {}
      var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', p || sys);
    })();
  </script>
  <script>
    /* Same reason as the theme script above: styles.css's :root hardcodes
       --accent/--accent-soft/--accent-2/--accent-glow to the "soul red"
       bucket colour (see chrome.js's CAR_ACCENTS). applyAccent() overrides
       them with the active car's real colour, but only runs once session.js
       has finished its async storage read — which is never before the
       browser's first paint. Without this, EVERY refresh briefly shows the
       red default (most visibly the page's own background glow, which is
       painted at the html/body level, not inside #view) regardless of which
       car or colour is actually active. chrome.js's applyAccent() writes
       this cache on every successful call; it is deliberately silent (no
       stylesheet default to fall back to here) when nothing was cached yet
       — a genuinely first-ever load has no prior colour to guess at, and
       the stylesheet's own default is a fine first frame for that one case. */
    (function () {
      try {
        var a = JSON.parse(localStorage.getItem('garage.accent'));
        if (!a) return;
        var s = document.documentElement.style;
        s.setProperty('--accent', a.accent);
        s.setProperty('--accent-soft', a.soft);
        s.setProperty('--accent-2', a.accent2);
        s.setProperty('--accent-glow', a.glow);
      } catch (e) {}
    })();
  </script>

        <div class="car-meta">
          <h1 id="carTitle">My car</h1>
          <p id="carSub"></p>
        </div>
      </button>
      <script>
        /* Same reason as the theme/accent scripts in <head> — see chrome.js's
           renderTopbar() comment for the cache this reads. Placed here, right
           after the elements it touches, rather than up in <head>: the browser
           paints incrementally as it parses, so a script in <head> waiting on
           DOMContentLoaded would run too late to beat that first paint — this
           one runs the instant #carTitle/#carSub exist, before the browser has
           a chance to show the generic "My car" skeleton text above. */
        (function () {
          try {
            var t = JSON.parse(localStorage.getItem('garage.topbar'));
            if (!t) return;
            document.getElementById('carTitle').textContent = t.title;
            document.getElementById('carSub').textContent = t.sub;
            document.title = 'Garage — ' + t.title;
          } catch (e) {}
        })();
      </script>
      <div class="topbar-actions">
        <!-- One menu replaces the four icon buttons that used to sit here
             (switch vehicle, account, settings, theme). Items are built on
             open, in main.js — they carry live state (the current vehicle
             name, the current theme) and translated labels. -->
        <div class="menu-wrap">
          <button class="icon-btn" id="accountBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
          <div class="menu" id="accountMenu" role="menu" hidden></div>
        </div>
      </div>
