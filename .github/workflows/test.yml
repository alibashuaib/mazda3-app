name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test` only learned to expand glob patterns in
          # Node 21, and the test script passes "test/**/*.test.js" so that
          # helper files under test/ are not collected as vacuous passing tests.
          node-version: '22'
      # fake-indexeddb and linkedom are the only dependencies and both are
      # dev-only — nothing the browser loads requires them, so the app still
      # ships with no build step and no runtime packages.
      - run: npm ci
      - run: npm test
      # Catches syntax errors in every shipped file. The suite parses the
      # modules it requires, but nothing loads app.js or sw.js, and a broken
      # app.js has twice passed a fully green suite.
      - run: find . -name '*.js' -not -path './node_modules/*' -not -path './test/*' -print0 | xargs -0 -n1 node --check

  # A real browser, because the Node suite runs against linkedom and therefore
  # cannot load the app the way a user does, cannot reproduce the real HTML
  # parser, and never touches IndexedDB. Separate job so unit-test feedback is
  # not held up by a browser download.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
